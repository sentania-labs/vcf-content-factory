# Publish vcf-cf-tooling-core
#
# Builds the vcfcf_core wheel from a core-vX.Y.Z tag and attaches it to a
# GitHub Release of the same name. The wheel is what the separate migrator
# tool pins by URL (knowledge/designs/tooling-core-carveout-v1.md).
#
# Placement (github-ci skill): needs no lab, no Docker daemon, so a
# GitHub-hosted runner; free on this public repo. The tag is the release
# (rule 13): merging to main builds nothing, pushing the tag does.
#
# Order inside the job, each step a gate for the next: refuse a bad tag,
# build, smoke (install into a clean venv with no PYTHONPATH and import),
# then publish.

name: Publish vcf-cf-tooling-core

on:
  push:
    tags:
      # Strict three-component semver. Never matches v* or sdk-buildkit-v*.
      - "core-v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write   # gh release create / upload

concurrency:
  group: publish-core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-core:
    # Releases are cut only from the upstream repo, never a clone.
    if: github.repository == 'sentania-labs/vcf-content-factory'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0   # setuptools-scm derives the version from the tag

      - name: Refuse a tag that is not on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${{ github.ref_name }} is not reachable from main; refusing to publish"
            exit 1
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
          ls -l dist/
          # The wheel must contain vcfcf_core and nothing else from src/.
          python - <<'PY'
          import glob, sys, zipfile
          whl = glob.glob("dist/*.whl")[0]
          bad = [n for n in zipfile.ZipFile(whl).namelist()
                 if not (n.startswith("vcfcf_core/") or ".dist-info/" in n)]
          if bad:
              print("::error::wheel carries files outside vcfcf_core:", bad[:10]); sys.exit(1)
          print("wheel contents ok:", whl)
          PY

      - name: Smoke test the wheel in a clean venv with no PYTHONPATH
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install --quiet dist/*.whl
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH "$RUNNER_TEMP/smoke/bin/python" - <<'PY'
          import vcfcf_core, vcfcf_core.supermetrics.crossref
          print("vcfcf_core", vcfcf_core.__version__, "imported clean")
          PY
          # The version baked into the wheel must be the tag's.
          want="${GITHUB_REF_NAME#core-v}"
          got="$("$RUNNER_TEMP/smoke/bin/python" -c 'import vcfcf_core; print(vcfcf_core.__version__)')"
          [ "$got" = "$want" ] || { echo "::error::wheel version $got does not match tag $want"; exit 1; }

      - name: Publish GitHub Release (idempotent per tag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" dist/* \
              --repo "${{ github.repository }}" \
              --title "vcf-cf-tooling-core $TAG" \
              --notes "Python wheel for the vcfcf_core library. Install: pip install <wheel URL>. Design: knowledge/designs/tooling-core-carveout-v1.md"
          fi
