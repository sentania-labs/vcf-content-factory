name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Canonical-repo gate: this workflow targets the lab runner pool and
    # only makes sense in the upstream repo. In a clone or fork of the
    # framework, `runs-on: lab` matches no runner and the job would queue
    # silently for ~24h; skip cleanly instead.
    # Fork-gate (second clause): do not run on PRs from outside the org
    # (prevents RCE on runners).
    if: >-
      github.repository == 'sentania-labs/vcf-content-factory' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.owner.login == 'sentania-labs')
    # Lab ARC runner pool (homelab-runner docs/ci-consumer-contract.md):
    # exact string "lab", ephemeral pod per job, no state between jobs.
    runs-on: lab
    env:
      # The ten vcfcf_* packages and the vcfcf_core library live under src/ (see pyproject.toml
      # src-layout). CI resolves them via PYTHONPATH — never `pip install`
      # the factory as a package — so the kit-isolation regression tests
      # (tests/managementpacks/test_buildkit_isolated_build.py and friends)
      # keep proving the published sdk-buildkit tarball works with zero
      # factory install. An editable/real install would leak vcfcf_* into
      # every subprocess via site-packages regardless of PYTHONPATH
      # stripping, silently blinding those guards.
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history so the framework-review reminder can diff a PR
          # against its base (merge-base needs reachable history).
          fetch-depth: 0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          # The lab runner image ships no JDK; ubuntu-latest provided one
          # implicitly. Without javac the SDK jar tests self-skip
          # (tests/test_sdk_builder_framework_jar.py pytestmark), silently
          # dropping coverage. Framework contract is JDK 11+, 17 recommended
          # (src/vcfcf_managementpacks/adapter_framework/build-framework.sh).
          distribution: temurin
          java-version: "17"

      - name: Install dependencies (system python3, user site)
        # Deliberately NOT actions/setup-python on this pool, and NOT a
        # venv either. Two pool-specific traps, both hit on this PR's runs:
        # 1. setup-python's toolcache build hardcodes
        #    RUNPATH=/opt/hostedtoolcache/.../lib, which does not exist on
        #    the lab pod, so tests spawning sys.executable with a scrubbed
        #    env (no LD_LIBRARY_PATH) silently ran under the SYSTEM
        #    libpython, lost site-packages, and failed with "No module
        #    named yaml".
        # 2. A venv python breaks the doctor tests that rebuild fixture
        #    .venvs around sys.executable: a relocated venv interpreter
        #    resolves packages via pyvenv.cfg at its own location, so the
        #    fixture copies see nothing.
        # The system interpreter with deps in user site (~/.local) has
        # neither problem: it is what ubuntu-latest effectively provided,
        # it survives relocation, and user site stays visible even to
        # env-scrubbed subprocesses (expanduser falls back to the pwd
        # database when HOME is stripped). --break-system-packages is safe
        # here: the pod is destroyed after the job (runner contract, one
        # ephemeral pod per job).
        # Test deps (pytest, pytest-xdist pin) live in requirements-dev.txt
        # so local and CI environments install the identical toolchain.
        # One more pool quirk: bare `python3` on the image PATH is the
        # baked /opt/pyenv venv (vSphere SDK), whose pip refuses --user.
        # Shim PATH so `python3` is the real /usr/bin/python3 for every
        # later step, then install to user site.
        run: |
          mkdir -p "$HOME/.ci-bin"
          ln -sf /usr/bin/python3 "$HOME/.ci-bin/python3"
          echo "$HOME/.ci-bin" >> "$GITHUB_PATH"
          /usr/bin/python3 --version
          /usr/bin/python3 -m pip --version || /usr/bin/python3 -m ensurepip --user
          /usr/bin/python3 -m pip install --user --break-system-packages -r requirements.txt -r requirements-dev.txt

      - name: Bootstrap SDK adapter repos
        run: bash scripts/bootstrap_managed_paks.sh

      - name: Framework-review reminder (non-blocking, P4)
        # Nudge only — emits a ::warning:: when a PR changes vcfcf_*/ with
        # no knowledge/context/reviews/framework/ doc. The real gate is the
        # orchestrator spawning `framework-reviewer` before the PR
        # (CLAUDE.md / knowledge/designs/framework-reviewer-v1.md). Never fails the
        # build: a doc-existence gate would be rubber-stampable and could
        # wedge legitimate hotfixes.
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --quiet origin "${{ github.event.pull_request.base.ref }}" || true
          bash scripts/check_framework_review.sh "origin/${{ github.event.pull_request.base.ref }}"

      - name: Run pytest (all tests)
        # pyproject.toml's [tool.pytest.ini_options] sets addopts=-m "not slow"
        # for fast local runs. CI must run the FULL suite, so we override
        # addopts to clear the
        # default marker filter and add -n auto for parallel execution.
        # -m "" means "no marker filter" (run everything including slow).
        run: |
          python3 -m pytest tests/ --collect-only -q 2>&1 | tee /tmp/collect.txt
          python3 -m pytest tests/ -v --tb=short -n auto --dist=loadgroup --override-ini="addopts=" -m ""

      - name: Build the vcf-cf-tooling-core wheel (packaging gate, no publish)
        # Proves pyproject.toml still produces a wheel holding only
        # vcfcf_core. The tag workflow (publish-core.yml) is the release.
        run: |
          python3 -m pip install --user --break-system-packages build
          python3 -m build --wheel --outdir "$RUNNER_TEMP/wheel"
          python3 - "$RUNNER_TEMP/wheel" <<'PY'
          import glob, sys, zipfile
          whl = glob.glob(sys.argv[1] + "/*.whl")[0]
          bad = [n for n in zipfile.ZipFile(whl).namelist()
                 if not (n.startswith("vcfcf_core/") or ".dist-info/" in n)]
          if bad:
              print("::error::wheel carries files outside vcfcf_core:", bad[:10]); sys.exit(1)
          print("wheel ok:", whl)
          PY
          # Install it somewhere that is not the repo and import with the
          # factory absent, so a broken wheel fails here and not at tag time.
          python3 -m pip install --quiet --target "$RUNNER_TEMP/site" "$RUNNER_TEMP"/wheel/*.whl
          ( cd "$RUNNER_TEMP" && PYTHONPATH="$RUNNER_TEMP/site" python3 -c "import vcfcf_core, vcfcf_core.supermetrics.crossref; print('import ok', vcfcf_core.__version__)" )
          rm -rf src/*.egg-info build

      - name: Validate content corpus
        run: |
          python3 -m vcfcf_supermetrics validate
          # Dashboard id-stability guard (#113): on PRs, compare against the
          # merge base so a re-id that is already committed is still caught.
          # BASE empty (merge-base unresolvable) falls back to the plain
          # invocation; the guard itself warns loudly in that case.
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ -n "${GITHUB_BASE_REF}" ]; then
            git fetch --no-tags --quiet origin "${GITHUB_BASE_REF}" || true
            BASE="$(git merge-base "origin/${GITHUB_BASE_REF}" HEAD || true)"
          else
            BASE=""
          fi
          if [ -n "${BASE}" ]; then
            python3 -m vcfcf_dashboards validate --id-guard-baseline "${BASE}"
          else
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
              echo "WARNING: id guard merge base unresolvable; committed re-ids in this PR are NOT checked (HEAD baseline only)"
            fi
            python3 -m vcfcf_dashboards validate
          fi
          python3 -m vcfcf_customgroups validate
          python3 -m vcfcf_symptoms validate
          python3 -m vcfcf_alerts validate
          python3 -m vcfcf_reports validate
          python3 -m vcfcf_managementpacks validate

      - name: Path reference audit (RULE-015)
        # Every path cited by the governance corpus must resolve — committed,
        # registry-fetchable, or a documented standing exception (warnings).
        # Exit 2 = dead reference shipped; fails the build.
        run: bash scripts/path_reference_audit.sh

      - name: Immutability guard (RULE-016)
        # reference/** is read-only: refuse PRs that modify or delete vendor
        # material. Additions and pure renames into/within reference/ pass.
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --quiet origin "${{ github.event.pull_request.base.ref }}" || true
          bash scripts/immutability_guard.sh --range "origin/${{ github.event.pull_request.base.ref }}...HEAD"

  sdk-compat:
    # Second SDK compile target (issue #211). The framework ships compiled
    # against the 9.0.2 jar (vrops-adapters-sdk-2.2.jar); this job proves the
    # same source also compiles against each newer platform's jar, so a class
    # a newer Ops build dropped fails CI instead of failing on a collector.
    #
    # One leg per extra target. The 9.0.2 leg is absent on purpose: the 2.2
    # jar lives only in the private vcf-content-factory-sdk-runtime repo and
    # this repo holds no key for it (the test job above compiles nothing
    # against a real SDK jar either). Adding it means an SDK_RUNTIME_SSH_KEY
    # secret here plus a leg that clones that repo, as the pak repos do.
    #
    # The 9.1.1.0100 jar's class files are Java 25 (major 69); JDK 17 javac
    # rejects them ("class file has wrong version 69.0"), hence JDK 25 here.
    # VCFCF_SDK_COMPAT_REQUIRED=1 turns a missing jar or JDK into a failure
    # instead of the local-build warning.
    #
    # GitHub-hosted: needs neither the lab nor a Docker daemon, and this repo
    # is public, so hosted minutes are free (github-ci skill, rule 4).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: "9.1.1.0100"
            jdk: "25"
            jar: reference/docs/vendor-jars/vrops-adapters-sdk-9.1.1.0100.jar
            sha256: 79f7b12340906359e04f3619dd87c7e67a9493b3fa5d86bdffe9242da67f46f7
    name: sdk-compat (${{ matrix.sdk }})
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Verify the SDK jar is the recorded build
        # Hash recorded in reference/docs/vendor-jars/PROVENANCE.md and
        # src/vcfcf_managementpacks/adapter_runtime/PROVENANCE.md.
        env:
          JAR: ${{ matrix.jar }}
          SHA256: ${{ matrix.sha256 }}
        run: echo "${SHA256}  ${JAR}" | sha256sum -c -

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install PyYAML (the vcfcf_managementpacks import needs it)
        run: python3 -m pip install pyyaml

      - name: Compile the framework against the ${{ matrix.sdk }} SDK jar
        env:
          VCFCF_SDK_COMPAT_JAR: ${{ matrix.jar }}
          VCFCF_SDK_COMPAT_REQUIRED: "1"
        run: bash src/vcfcf_managementpacks/adapter_framework/build-framework.sh --compat-only
