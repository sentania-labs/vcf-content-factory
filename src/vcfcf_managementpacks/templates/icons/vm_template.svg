<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- VM template: a monitor outline inside a dashed stencil border -->
  <!-- Dashed stencil border -->
  <rect x="44" y="44" width="312" height="312" rx="24"
        fill="none" stroke="#005c8a" stroke-width="10" stroke-dasharray="26 18" stroke-linecap="round"/>
  <!-- Monitor screen -->
  <rect x="92" y="88" width="216" height="152" rx="12"
        fill="none" stroke="#0098c7" stroke-width="16" stroke-linejoin="round"/>
  <!-- Virtual machine block on the screen -->
  <rect x="148" y="124" width="104" height="80" rx="8" fill="#0098c7" opacity="0.22"/>
  <rect x="148" y="124" width="104" height="80" rx="8"
        fill="none" stroke="#005c8a" stroke-width="10" stroke-linejoin="round"/>
  <!-- Stand -->
  <line x1="200" y1="248" x2="200" y2="292" stroke="#0098c7" stroke-width="14" stroke-linecap="round"/>
  <!-- Base -->
  <line x1="140" y1="304" x2="260" y2="304" stroke="#0098c7" stroke-width="16" stroke-linecap="round"/>
</svg>
