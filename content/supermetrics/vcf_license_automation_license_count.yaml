id: 2f9fa681-2625-4aeb-a2f4-90df2aea2321
name: "[VCF Content Factory] Automation Licensed Cores"
resource_kinds:
  - resource_kind_key: CAS World
    adapter_kind_key: CASAdapter
description: >
  Licensed cores across the vSphere hosts VCF Automation knows about -
  the "how much of my VCF core count is Automation-managed" figure.
  Assigned to the CAS World rollup resource ("Automation World" display
  name; resource kind schema confirmed on ro818, but 0 live objects -
  no CASAdapter instance configured on either recon target) and sums
  the per-host "[VCF Content Factory] Host VCF Licensed Cores
  (16-core minimum)" super metric over VMWARE/HostSystem objects reached
  from CAS World at depth=10.

  Targets VCF Operations 8.x.

  Re-derives the dangling sm_5ea91f64-b7e9-4a77-baa7-1e8ebea1e322
  reference from Scott's community "VCF Consumption Overview v2" bundle
  (that SM is absent from the export and 404s live on both ro818 8.18.7
  and prod 9.1.0). Only change from the source formula: the dangling
  UUID becomes a name reference to the re-derived per-host SM. The
  relationship path is otherwise reproduced exactly - a single
  adaptertype=VMWARE, objecttype=HostSystem, depth=10 walk from the
  CAS World assignment object, the same shape as the sibling
  "[VCF Content Factory] NSX Licensed Cores" SM's walk from NSXT World.

  No-CAS-objects caveat: recon found 0 CASAdapter resources of any kind
  on both ro818 and prod (no CASAdapter instance is even configured) -
  neither the relationship nor non-zero output could be exercised live.
  This SM is structurally verified only (imports and validates cleanly),
  not proven against real Automation host data. On VCF Operations 9.x,
  CASAdapter/CAS World is additionally superseded on prod by
  VCFAutomation/Automation World, which does not carry the same
  statkey vocabulary - this SM targets the 8.x CASAdapter shape per the
  task; a 9.x port would need the VCFAutomation adapter kind and its
  renamed keys instead. Needs a lab with an actual CASAdapter instance
  and prepared hosts to confirm the walk resolves and the sum is
  non-zero.

  Cross-SM reference note: this SM reads the upstream per-host SM's
  previous-cycle value (platform does not guarantee same-cycle
  recomputation across a super metric chain) - accepted one-cycle lag,
  not expressible as a single self-contained formula since the per-host
  ternary must run once per HostSystem before the CAS-World-level sum.

  Feeds Automation Usage Insights (Automation License Consumption),
  Automation Consumption Trend, and Automation Licensing Overtime.
formula: |
  sum(${adaptertype=VMWARE, objecttype=HostSystem, metric=@supermetric:"[VCF Content Factory] Host VCF Licensed Cores (16-core minimum)", depth=10})
