id: faab0b29-40b7-4141-8132-7602b4a93338
name: "[VCF Content Factory] Total Snapshot Space (GB)"
resource_kinds:
  - resource_kind_key: vSphere World
    adapter_kind_key: VMWARE
description: >
  Fleet-wide sum of VM snapshot space (GB) across all VMWARE VirtualMachine
  descendants, assigned to vSphere World so it computes once per fleet.
  Source metric diskspace|snapshot is a flat per-VM GB metric (live-verified
  in recon 2026-07-27), chosen over summary|snapshotSpace for consistency
  with the companion "[VCF Content Factory] VM Snapshot Inventory" view's
  filter/columns. depth=5 walks from vSphere World through vCenter,
  Datacenter, ClusterComputeResource, and HostSystem to VirtualMachine (same
  hop count as the companion "[VCF Content Factory] VMs with Snapshots
  (Count)" SM and the vendor-attested "Total VMs Minus BAP VMs v2"
  World-scope precedent). Feeds the scoreboard tile on the VM Snapshot
  Inventory dashboard.
formula: |
  sum(${adaptertype=VMWARE, objecttype=VirtualMachine,
        metric=diskspace|snapshot, depth=5})
