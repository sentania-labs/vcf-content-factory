id: 2e1fd028-c21f-4324-bc07-a83b8b86a124
name: "[VCF CF] Cluster - CPU Allocation Remaining %"
resource_kinds:
  - resource_kind_key: ClusterComputeResource
    adapter_kind_key: VMWARE
description: >
  vCPU capacity remaining under the CPU allocation model, as a percentage of
  usable allocation capacity (the engine's own figure; observed on the
  lab cluster as total cores x the policy ratio, e.g. 72 = 24 x 3). This
  metric does not itself subtract an HA reserve. Computed on a cluster. The native per-resource
  capacityRemainingPercentage keys never carry a value, so this divides the
  engine's own remaining figure by its usable capacity (both in vCPUs); the
  engine's remaining figure floors at 0, so a full cluster reads 0. The
  division is deliberately unguarded: when the allocation model is not
  configured, usable capacity is absent or 0 and the metric yields no value
  instead of 0, because 0 means "full". OBSERVED (devel_8_18, 8.18.7,
  2026-11-20): with no ratio set for the resource, the super metric has no
  stat at all (no stored 0, NaN or Infinity). Unit: percent.
formula: |
  ${this, metric=OnlineCapacityAnalytics|cpu|alloc|capacityRemaining} / ${this, metric=cpu|alloc|usableCapacity} * 100
