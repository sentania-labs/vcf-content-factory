id: 72517e70-514a-4efe-955b-a14d5a3c2697
name: "[VCF Content Factory] vSAN Total License Capacity (TiB)"
resource_kinds:
  - resource_kind_key: LICENSE_USAGE_WORLD
    adapter_kind_key: VMWARE_INFRA_HEALTH
description: >
  Total vSAN capacity licensed (capacity, not consumption), in TiB, summed
  from the platform's own license usage objects. Assigned to the
  LICENSE_USAGE_WORLD rollup resource (1 object, "License Usage") and sums
  CostUnitAttributes|CostUnitLimit across its LicenseUsage descendants (11
  objects on ro818, one per license key/product), filtered to ProductId
  startsWith "vSAN" so every vSAN edition (e.g. "vSAN Enterprise") is
  included by design.

  Targets VCF Operations 8.x (confirmed live and populated on Aria/VCF
  Operations 8.18.7: CostUnitAttributes|CostUnitLimit and ProductId both
  defined and populated across 11 LicenseUsage objects, sample value 2000.0;
  not populated on VCF Operations 9.1.0, where LicenseUsage has zero live
  objects). CostUnitAttributes|CostUnitLimit is a property on 8.18, not a
  metric, but the DSL's `metric=` selector accepts property keys and the
  source formula worked this way; kept verbatim.

  Any product string other than the exact filter literal sums to zero
  silently, with no error (DSL pitfall: misspelled/mismatched where-clause
  literals import and validate cleanly but never produce data) - if
  Broadcom renames this SKU string, the formula must be updated by hand.

  Formula and where-clause literal kept verbatim from Scott's community
  "VCF Consumption Overview v2" bundle (source SM: "[VCF Consumption
  Overview v2] vSAN Total License Capacity"); renamed prefix only for this
  rebuild. Feeds the License Overview scoreboard (Total vSAN License
  Capacity (TiB)) and the VCF Licensing Overtime month table.
formula: |
  sum(${adaptertype=VMWARE_INFRA_HEALTH, objecttype=LicenseUsage, metric=CostUnitAttributes|CostUnitLimit, depth=10, where="ProductId startsWith vSAN"})
