id: 66a9987f-8373-4254-8bdc-6f32429d5f4a
name: "[VCF Content Factory] NSX Licensing by Month"
description: >
  Month-by-month NSX prepared host count and licensed cores, one row per month over the
  trailing year. Targets VCF Operations 8.x (validated against Aria Operations 8.18.7
  recon, adapter_kind NSXTAdapter / resource_kind NSXT World; 0 TransportNode objects on
  ro818 today, structural only until a lab has real NSX transport nodes). Rebuilt from
  Scott's public "VCF Consumption Overview v2" community content (NSX Licensing Overtime).

subject:
  adapter_kind: NSXTAdapter
  resource_kind: NSXT World

time_window:
  unit: YEARS
  count: 1

hide_object_name: true

columns:
  - display_name: Month
    time_segment:
      breakdown_by: MONTHS
      starting_on_unit: WEEKS
      starting_on_count: 1

  - attribute: 'supermetric:"[VCF Content Factory] NSX Host Transport Node Count"'
    display_name: "NSX Prepared Host Count"
    transformation: CURRENT

  - attribute: 'supermetric:"[VCF Content Factory] NSX Licensed Cores"'
    display_name: "NSX License Consumption"
    transformation: CURRENT
