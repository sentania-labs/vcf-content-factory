id: 4b12808a-1002-4146-b16f-38fc999f3634
name: "[VCF CF] Undersized VMs, Add Resources"
description: >
  Per-VM resource-addition list for undersized virtual machines. Shows the
  parent cluster, vCPUs to add, and memory to add (KB source, displayed in GB)
  for each VM flagged undersized by the VCF Ops capacity engine
  (summary|undersized == 1). Intended as Band D-2 of the Fleet Capacity &
  Rightsizing dashboard; receives ClusterComputeResource resourceId from the
  upstream cluster-selector widget to scope the list to the selected cluster.
  Default sort is vCPUs to Add descending (largest need first), set on the
  view itself, so every dashboard that embeds it opens in that order.
  Also shows current vCPU and memory (GB), plus 30-day CPU Demand and Mem Usage
  Avg / Max / P95 percent columns (view time window: 30 days) so the effect of a
  resize can be judged from the list.
  View will be empty until at least one VM is flagged undersized; this is
  expected (recon confirmed 0 undersized VMs at authoring time).
subject:
  adapter_kind: VMWARE
  resource_kind: VirtualMachine

customgroup: "[VCF CF] VMs - Undersized Only"

summary: false

time_window:
  unit: DAYS
  count: 30

columns:
  # Parent cluster, standard relationship property (same form as sibling views).
  - attribute: summary|parentCluster
    display_name: "Cluster"
    unit: ""

  # Current allocation, latest value (no transformation = CURRENT, ignores the 30-day window).
  - attribute: cpu|corecount_provisioned
    display_name: "vCPU"
    unit: ""

  # preferredUnitId="gb" makes the server convert KB to GB natively.
  - attribute: config|hardware|memoryKB
    display_name: "Memory (GB)"
    unit: "gb"

  # vCPUs the capacity engine recommends changing. Primary sort column.
  - attribute: summary|undersized|vcpus
    display_name: "vCPUs to Add"
    sort: desc

  - attribute: summary|undersized|memory
    display_name: "Memory to Add (GB)"
    unit: "gb"

  # 30-day CPU demand (view time_window), Avg / Max / P95.
  - attribute: cpu|demandPct
    display_name: "CPU Demand Avg %"
    unit: percent
    transformation: AVG

  - attribute: cpu|demandPct
    display_name: "CPU Demand Max %"
    unit: percent
    transformation: MAX

  - attribute: cpu|demandPct
    display_name: "CPU Demand P95 %"
    unit: percent
    transformation: PERCENTILE
    percentile: 95

  # 30-day memory usage (view time_window), Avg / Max / P95.
  - attribute: mem|usage_average
    display_name: "Mem Usage Avg %"
    unit: percent
    transformation: AVG

  - attribute: mem|usage_average
    display_name: "Mem Usage Max %"
    unit: percent
    transformation: MAX

  - attribute: mem|usage_average
    display_name: "Mem Usage P95 %"
    unit: percent
    transformation: PERCENTILE
    percentile: 95

released: false
version: "1.1.0"
