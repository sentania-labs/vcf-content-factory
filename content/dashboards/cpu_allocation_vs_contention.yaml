description: 'Allocation-first CPU capacity view for customers who plan by vCPU:pCore
  ratio. Fleet scoreboard, a per-cluster list (the primary selector) that puts the
  ratio beside contention evidence, two heatmaps (size = allocation, colour = share
  of VMs facing CPU ready), host and VM drill-downs for the selected cluster, and
  the stock allocation trend for that cluster. Ratios are against physical cores,
  powered-on VMs only. No fixed ratio is right: start conservative and let contention
  decide how far the ratio can grow.

  '
id: 4eef8953-278f-4f81-9d57-81264406d155
interactions:
- from: cluster_alloc_view
  to: host_alloc_view
  type: resourceId
- from: cluster_alloc_view
