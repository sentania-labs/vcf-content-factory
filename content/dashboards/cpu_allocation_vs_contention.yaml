id: 4eef8953-278f-4f81-9d57-81264406d155
name: "[VCF CF] CPU Allocation vs Contention"
description: >
  Allocation-first CPU capacity view for customers who plan by vCPU:pCore ratio.
  Fleet scoreboard, a per-cluster list (the primary selector) that puts the
  ratio beside contention evidence, two heatmaps (size = allocation, colour =
  share of VMs facing CPU ready), host and VM drill-downs for the selected
  cluster, and the stock allocation trend for that cluster. Ratios are against
  physical cores, powered-on VMs only. No fixed ratio is right: start
  conservative and let contention decide how far the ratio can grow.
released: false
version: "1.0.0"

widgets:
  - id: fleet_allocation
    type: Scoreboard
    title: "Fleet Allocation"
    coords: {x: 1, y: 1, w: 12, h: 3}
    self_provider: true
    pin:
      adapter_kind: VMWARE
      resource_kind: vSphere World
    box_columns: 6
    metrics:
      - adapter_kind: VMWARE
        resource_kind: vSphere World
        metric_key: summary|total_number_clusters
        metric_name: "Clusters"
        label: "Clusters"
        color_method: 1
      - adapter_kind: VMWARE
        resource_kind: vSphere World
        metric_key: summary|total_number_hosts
        metric_name: "Hosts"
        label: "Hosts"
        color_method: 1
      - adapter_kind: VMWARE
        resource_kind: vSphere World
        metric_key: summary|total_number_vms
        metric_name: "VMs"
        label: "VMs"
        color_method: 1
      - adapter_kind: VMWARE
        resource_kind: vSphere World
        metric_key: cpu|corecount_provisioned
        metric_name: "Physical Cores"
        label: "Physical Cores"
        color_method: 1
      - adapter_kind: VMWARE
        resource_kind: vSphere World
        metric_key: cpu|vcpus_allocated_on_all_powered_on_vms
        metric_name: "vCPUs Allocated (powered on)"
        label: "vCPUs Allocated (powered on)"
        color_method: 1
      - adapter_kind: VMWARE
        resource_kind: vSphere World
        metric_key: cpu|vcpus_to_cores_allocation_ratio
        metric_name: "vCPU:pCore Ratio"
        label: "vCPU:pCore Ratio"
        color_method: 0
        yellow_bound: 2
        orange_bound: 4
        red_bound: 8

  - id: cluster_alloc_view
    type: View
    title: "Cluster CPU Allocation vs Contention"
    coords: {x: 1, y: 4, w: 12, h: 7}
    self_provider: true
    pin:
      adapter_kind: VMWARE
      resource_kind: vSphere World
    view: "[VCF CF] Cluster CPU Allocation vs Contention"

  - id: cluster_heatmap
    type: Heatmap
    title: "Clusters: size = ratio, colour = contention"
    coords: {x: 1, y: 11, w: 6, h: 5}
    self_provider: true
    pin:
      adapter_kind: VMWARE
      resource_kind: vSphere World
    mode: all
    depth: 10
    configs:
      - name: "Cluster ratio vs contention"
        adapter_kind: VMWARE
        resource_kind: ClusterComputeResource
        size_by:
          metric_key: cpu|vcpus_to_cores_allocation_ratio
          label: "vCPU:pCore Ratio"
        color_by:
          metric_key: cpu|percentage_of_vms_facing_cpu_ready
          label: "% VMs Facing CPU Ready"
        group_by: {}
        color:
          min_value: 0
          max_value: 10
          thresholds:
            values: [0, 3.3, 6.7, 10]
            colors: ["#74B43B", "#ECC33E", "#F5A623", "#DE3F30"]
        solid_coloring: false
        focus_on_groups: false

  - id: host_heatmap
    type: Heatmap
    title: "Hosts: size = vCPUs placed, colour = contention"
    coords: {x: 7, y: 11, w: 6, h: 5}
    self_provider: true
    pin:
      adapter_kind: VMWARE
      resource_kind: vSphere World
    mode: all
    depth: 10
    configs:
      - name: "Host vCPUs vs contention"
        adapter_kind: VMWARE
        resource_kind: HostSystem
        size_by:
          metric_key: cpu|vcpus_allocated_on_all_powered_on_vms
          label: "vCPUs Allocated (powered on)"
        color_by:
          metric_key: cpu|percentage_of_vms_facing_cpu_ready
          label: "% VMs Facing CPU Ready"
        group_by:
          adapter_kind: VMWARE
          resource_kind: ClusterComputeResource
          text: Cluster Compute Resource
        color:
          min_value: 0
          max_value: 7.5
          thresholds:
            values: [0, 2.5, 5, 7.5]
            colors: ["#74B43B", "#ECC33E", "#F5A623", "#DE3F30"]
        solid_coloring: false
        focus_on_groups: true

  - id: host_alloc_view
    type: View
    title: "Hosts in Selected Cluster"
    coords: {x: 1, y: 16, w: 12, h: 5}
    view: "[VCF CF] Host CPU Allocation vs Contention"

  - id: vm_alloc_view
    type: View
    title: "VMs in Selected Cluster"
    coords: {x: 1, y: 21, w: 12, h: 5}
    view: "[VCF CF] VM vCPU Allocation vs Contention"

  - id: ratio_trend_view
    type: View
    title: "Overcommit Ratio Trend, Selected Cluster"
    coords: {x: 1, y: 26, w: 12, h: 4}
    view: "3b7bba92-680c-42ba-b8a9-aa9202f0cc71"

interactions:
  - from: cluster_alloc_view
    to: host_alloc_view
    type: resourceId
  - from: cluster_alloc_view
    to: vm_alloc_view
    type: resourceId
  - from: cluster_alloc_view
    to: ratio_trend_view
    type: resourceId
