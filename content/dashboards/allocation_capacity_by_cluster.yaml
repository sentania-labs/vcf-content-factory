description: 'Allocation-model capacity per cluster for customers who plan by overcommit
  ratio. A per-cluster list (the primary selector) sets the planned ratio from policy
  beside the ratio the cluster actually runs at, with allocation capacity remaining,
  days left and the demand model''s answer for contrast. A scoreboard shows the selected
  cluster''s ratios, three fleet heatmaps (size = capacity, colour = allocation remaining
  %, lower is worse) cover CPU, memory and disk, and the stock allocation trend follows
  the selected cluster. Remaining % is computed by factory super metrics, not native
  keys.

  '
id: eb613c84-cee6-498b-9e19-fd0f68e4cf2a
