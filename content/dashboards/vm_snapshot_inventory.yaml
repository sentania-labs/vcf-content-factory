id: 9c6a3e0a-2c1b-4d7e-9b0a-9f4b6a2e5d13
name: "[VCF Content Factory] VM Snapshot Inventory"
description: >
  Fleet-wide VM snapshot inventory. Row 1 answers "how bad is it?" with two
  self-provider Scoreboard tiles pinned to vSphere World, driven by
  world-scope Super Metrics (VMs with Snapshots (Count),
  Total Snapshot Space (GB) — content/supermetrics/vms_with_snapshots_count.yaml,
  content/supermetrics/total_snapshot_space_gb.yaml). Row 2 answers
  "which snapshots?" with the full per-snapshot inventory view (one row
  per snapshot instance, instanced-group fan-out; see
  content/views/vm_snapshot_inventory.yaml for the ghost-row and
  Creator/Description-disabled-by-default caveats).

  Sort note: the view's own note recommends sorting the embedded table by
  the flat "Total Snapshot Space (GB)" column descending as the best
  available proxy (the instanced Age column has no single attribute key
  and cannot be a sort target). However, initial sort order for View
  widgets is not a loader/wire-format-supported field in this framework
  (see knowledge/context/authoring/view_dashboard_design_guide.md,
  "What views and dashboards cannot do" — Initial sort order in YAML is
  not configurable, same limitation noted in oversized_vms_reclaimable.yaml
  and the other views that carry this comment). The dashboard cannot force
  this sort at import time; users set it in the UI on first view.

released: false
version: "1.0.0"

widgets:
  - id: vms_with_snapshots_count
    type: Scoreboard
    title: "VMs with Snapshots"
    coords: {x: 1, y: 1, w: 4, h: 4}
    self_provider: true
    pin:
      adapter_kind: VMWARE
      resource_kind: vSphere World
    box_columns: 1
    metrics:
      - adapter_kind: VMWARE
        resource_kind: vSphere World
        metric_key: "Super Metric|sm_77dca431-01ec-4a7c-824e-275908b89472"
        metric_name: "VMs with Snapshots (Count)"
        label: "VMs with Snapshots"
        color_method: 1

  - id: total_snapshot_space_gb
    type: Scoreboard
    title: "Total Snapshot Space (GB)"
    coords: {x: 5, y: 1, w: 4, h: 4}
    self_provider: true
    pin:
      adapter_kind: VMWARE
      resource_kind: vSphere World
    box_columns: 1
    metrics:
      - adapter_kind: VMWARE
        resource_kind: vSphere World
        metric_key: "Super Metric|sm_faab0b29-40b7-4141-8132-7602b4a93338"
        metric_name: "Total Snapshot Space (GB)"
        label: "Total Snapshot Space (GB)"
        color_method: 1

  - id: snapshot_visibility_note
    type: TextDisplay
    title: "Note"
    coords: {x: 9, y: 1, w: 4, h: 4}
    html: >
      <p>Snapshots appear here only once they are older than 24 hours —
      snapshot properties (name, creator, age) populate 24h after
      creation.</p>

  - id: snapshot_inventory_view
    type: View
    title: "VM Snapshot Inventory"
    coords: {x: 1, y: 5, w: 12, h: 12}
    self_provider: true
    pin:
      adapter_kind: VMWARE
      resource_kind: vSphere World
    view: "[VCF Content Factory] VM Snapshot Inventory"
