    box_columns: 2
    show_metric_name: true
    show_metric_unit: true
    metrics:
      - adapter_kind: CASAdapter
        resource_kind: CAS World
        metric_key: "Super Metric|sm_5c08ad62-03b1-48f7-9bb2-2514dbf61b1e"
        metric_name: "Automation Managed Host Count"
        label: "Managed vSphere Hosts"
        color_method: 1
      - adapter_kind: CASAdapter
        resource_kind: CAS World
        metric_key: "summary|VMCount"
        metric_name: "Managed VM Count"
        label: "Managed VM Count"
        color_method: 1
      - adapter_kind: CASAdapter
        resource_kind: CAS World
        metric_key: "summary|Cost"
        metric_name: "Cost"
        label: "Cost"
        color_method: 1
      - adapter_kind: CASAdapter
        resource_kind: CAS World
        metric_key: "Super Metric|sm_2f9fa681-2625-4aeb-a2f4-90df2aea2321"
        metric_name: "Automation Licensed Cores"
        label: "Automation License Consumption"
        color_method: 1

  # ── W8 · View, NSX Consumption Trend  (x:1 y:19 w:6 h:6) ──────────────────

  - id: nsx_trend
