name: vcf-license-consumption-overview
display_name: VCF License Consumption Overview
description: >
  One-screen license position for a VCF estate: consumed vs owned VCF cores and vSAN
  TiB, read directly from the platform's own license usage objects, plus how much of
  the vSphere estate NSX and Automation actually touch. Targets VCF Operations 8.x
  (Aria Operations 8.18.7 vocabulary: VMWARE_INFRA_HEALTH/LicenseUsage,
  NSXTAdapter/NSXT World, CASAdapter/CAS World). The NSX and Automation halves of the
  dashboard (transport node counts, licensed cores, managed hosts) only populate on an
  instance where the NSX-T and VCF Automation (CAS) adapters are actually configured;
  on a lab without those adapter instances they render structurally but stay empty.
  Rebuilt from Scott's public "VCF Consumption Overview v2" community content
  (sentania/AriaOperationsContent). Values are unproven end-to-end: the VCF/vSAN half
  is confirmed live and populated on lab ro818 (Aria Operations 8.18.7, real license
  entitlements), but the NSX and Automation halves have never been exercised against
  live NSX transport nodes or a live CASAdapter instance on any recon target. See
  knowledge/context/investigations/2026-08-26-vcf-license-consumption-recon-818.md
  for the full recon trail.
