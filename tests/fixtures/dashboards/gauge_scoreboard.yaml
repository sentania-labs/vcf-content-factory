id: 7d1c5a2e-3b4f-4c6d-8e9f-0a1b2c3d4e5f
name: "[VCF Content Factory] Gauge Fixture"
description: One gauge scoreboard (visual_theme 9) over public VMWARE kinds.
widgets:
  - id: cpu_gauge
    type: Scoreboard
    title: CPU Usage
    coords: {x: 1, y: 1, w: 3, h: 4}
    visual_theme: 9
    box_columns: 1
    show_remaining: true
    layout_mode: floatingView
    metrics:
      - adapter_kind: VMWARE
        resource_kind: VirtualMachine
        metric_key: cpu|usage_average
        metric_name: CPU Usage
        unit: "%"
        max_value: 100
        color_method: 0
        yellow_bound: 70
        orange_bound: 85
        red_bound: 95
      - adapter_kind: VMWARE
        resource_kind: HostSystem
        metric_key: mem|usage_average
        metric_name: Memory Usage
        unit: "%"
        max_value: 99.5
        color_method: 0
        yellow_bound: 80
        orange_bound: 90
        red_bound: 95
interactions: []
