# This file has two roles, and the [project] table below serves exactly one
# of them: it is the packaging metadata for the vcf-cf-tooling-core LIBRARY
# (import name vcfcf_core, source src/vcfcf_core/). It is NOT a way to install
# the factory.
#
# The factory (the other ten vcfcf_* packages under src/) is never
# pip-installed: not from local dev, not from CI (.github/workflows/*.yml),
# not from Claude Code / agent shells (.claude/settings.json). It resolves
# purely via an ambient PYTHONPATH=src, set by .claude/settings.json for agent
# shells and by an `env:` block in each CI workflow. Its runtime and dev
# dependencies live in requirements.txt and requirements-dev.txt; install
# those directly, never `pip install .` / `pip install -e .` to drive the
# factory.
#
# Why the factory stays out of site-packages: an install (editable or plain)
# would register the vcfcf_* factory packages for every subprocess sharing
# the interpreter, regardless of PYTHONPATH stripping. That silently blinds
# the kit-isolation regression tests (tests/managementpacks/
# test_buildkit_isolated_build.py and friends), which prove the published
# sdk-buildkit tarball works with zero factory install.
#
# How this file keeps that promise while also building a wheel: the
# [tool.setuptools] `packages` list below is EXPLICIT and names only
# vcfcf_core and its subpackages. setuptools' auto-discovery (which would
# otherwise sweep every src/ package into the wheel, the failure mode the
# previous version of this file documented as "UNKNOWN-0.0.0") is disabled
# by the presence of that explicit list. `pip install .` therefore installs
# vcfcf_core and nothing else; `import vcfcf_common` still fails in a clean
# venv. tests/test_core_contract.py keeps vcfcf_core free of any import of
# the factory packages, so the wheel cannot drag them in transitively.
#
# Versioning: the library's version comes from a `core-vX.Y.Z` git tag via
# setuptools-scm (tag_regex below matches only that prefix, so the factory's
# own vX.Y.Z tags and the sdk-buildkit-vX.Y.Z tags never bump it). An
# untagged tree gets a PEP 440 dev version derived from the commit distance;
# a tree with no git metadata at all (a git-archive tarball) gets
# fallback_version. vcfcf_core.__version__ reads the installed metadata and
# reports "0.0.0+src" when run from the tree with no wheel installed.
#
# Design: knowledge/designs/tooling-core-carveout-v1.md.

[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "vcf-cf-tooling-core"
description = "Location-agnostic core of the VCF Content Factory: parse, render, and walk VCF Operations content in memory."
readme = { text = "vcf-cf-tooling-core (import name vcfcf_core) is the part of the VCF Content Factory with no opinion about where it runs. See https://github.com/sentania-labs/vcf-content-factory.", content-type = "text/markdown" }
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/sentania-labs/vcf-content-factory"

[tool.setuptools]
# Explicit list: nothing else under src/ may end up in the wheel.
package-dir = { "" = "src" }
packages = [
    "vcfcf_core",
    "vcfcf_core.alerts",
    "vcfcf_core.dashboards",
    "vcfcf_core.packaging",
    "vcfcf_core.reports",
    "vcfcf_core.supermetrics",
    "vcfcf_core.symptoms",
]

[tool.setuptools_scm]
# Only core-vX.Y.Z tags version the library.
tag_regex = "^core-v(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)$"
git_describe_command = "git describe --dirty --tags --long --match core-v*"
fallback_version = "0.0.0"

[tool.pytest.ini_options]
# ---------------------------------------------------------------------------
# Markers
# ---------------------------------------------------------------------------
# slow  — tests that build real zips, run full validators against the real
#         corpus, or otherwise take >~2s individually.  The default local run
#         excludes them (addopts below).  CI overrides with -m "" to run all.
#
# real_corpus — xdist isolation group.  Tests that READ the real content/
#               directories through subprocess validators (publish tests using
#               factory_repo=REPO_ROOT) must not run concurrently with each
#               other.  Tagging them with the same xdist_group colocates them
#               on a single worker where they run sequentially.
#               NOTE: test_validate_content_hook.py is NOT in this group —
#               it is hermetic (uses VCFCF_CONTENT_ROOT to write into a
#               tmp_path copy, never touching the real content/ tree).
#               IMPORTANT: this group is only effective when using
#               --dist=loadgroup (see addopts / CI command).
markers = [
    "slow: marks tests as slow (deselect with -m \"not slow\")",
    "real_corpus: xdist group for tests that read or write the real content/ corpus",
]

# ---------------------------------------------------------------------------
# Default: fast subset only
# ---------------------------------------------------------------------------
# Excludes `slow` tests on every plain `pytest` invocation so the local
# edit-test loop stays fast.
#
# CI MUST override this.  The workflow passes:
#   -m "" --override-ini="addopts="
# to run the full suite.  See .github/workflows/ci.yml for the comment
# explaining why.
#
# --dist=loadgroup is deliberately NOT in addopts: pytest-xdist is a dev
# dependency (requirements-dev.txt), and an xdist flag here would break
# plain `pytest` on a fresh clone without it.  When you pass -n, you MUST
# also pass --dist=loadgroup (tests/conftest.py enforces this) so the
# real_corpus group serializes correctly.
addopts = "-m \"not slow\""
